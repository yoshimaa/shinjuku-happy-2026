<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>ハッピー商品券</title>
  <meta name="description" content="新宿区 商店街ハッピー商品券の取扱店検索アプリ（非公式）">
  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="ハッピー商品券">
  <meta name="apple-mobile-web-app-title" content="ハッピー商品券">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-sheet="peek">
  <div id="map" aria-label="取扱店マップ"></div>

  <header class="searchbar">
    <label class="search">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="店名・業種・住所で検索" autocomplete="off" enterkeyhint="search">
    </label>
    <button id="open-filter" class="filter-btn" type="button" aria-label="絞り込み">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span id="filter-count" class="badge" hidden></span>
    </button>
  </header>

  <nav class="catbar" aria-label="分類">
    <div id="cat-big" class="pills"></div>
    <div id="cat-mid" class="pills sub-pills" hidden></div>
  </nav>

  <button id="locate" class="locate-btn" type="button">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    <span id="locate-label" class="locate-label">現在地から探す</span>
  </button>

  <section id="sheet" class="sheet">
    <button id="sheet-toggle" class="sheet-head" type="button" aria-expanded="false">
      <span class="grip" aria-hidden="true"></span>
      <span class="sheet-title">取扱店一覧</span>
      <span id="result-count" class="sheet-count"></span>
    </button>
    <div id="active-filters" class="active-filters"></div>
    <ul id="list" class="list"></ul>
    <footer class="credit">
      <p>非公式アプリです。最新情報は<a href="https://shinjuku-happy.jp/" target="_blank" rel="noopener">公式サイト</a>をご確認ください。</p>
      <p>店舗データ：<a href="https://shinjuku-happy.jp/shop/" target="_blank" rel="noopener">商品券取扱店検索</a>（2026年10月4日時点）</p>
    </footer>
  </section>

  <button id="show-map" class="map-btn" type="button">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4-6 2v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>
    地図を表示
  </button>

  <div id="toast" class="toast" role="status" hidden></div>

  <div id="filter-backdrop" class="backdrop" hidden></div>
  <section id="filter" class="filter" role="dialog" aria-modal="true" aria-labelledby="filter-title" hidden>
    <div class="filter-head">
      <span class="grip" aria-hidden="true"></span>
      <h2 id="filter-title">絞り込み</h2>
      <button id="reset" class="link-btn" type="button">リセット</button>
    </div>
    <div class="filter-body">
      <fieldset>
        <legend>使える券種</legend>
        <div id="f-ticket" class="chips"></div>
        <p class="hint">選んだ券種がすべて使える店舗を表示します。応援券は中小企業・個人店、共通券はすべての取扱店で使えます。</p>
      </fieldset>
      <fieldset>
        <legend>分類</legend>
        <div id="f-big" class="chips"></div>
        <div id="f-mid-wrap" class="sub" hidden>
          <p class="sub-label">詳しい分類</p>
          <div id="f-mid" class="chips"></div>
        </div>
      </fieldset>
      <fieldset>
        <legend>エリア</legend>
        <div id="f-area" class="chips"></div>
      </fieldset>
      <fieldset>
        <legend><label for="f-assoc">商店会</label></legend>
        <select id="f-assoc" class="select"></select>
      </fieldset>
      <fieldset class="row">
        <legend class="sr-only">その他</legend>
        <label class="switch">
          <span>
            <strong>重複掲載の店舗も表示</strong>
            <small>複数の商店会に掲載されている店舗の2件目以降</small>
          </span>
          <input id="f-deleted" type="checkbox">
          <span class="track" aria-hidden="true"></span>
        </label>
      </fieldset>
    </div>
    <div class="filter-foot">
      <button id="apply" class="primary-btn" type="button">結果を表示</button>
    </div>
  </section>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
